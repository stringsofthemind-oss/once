<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Once — subscription started</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #071018; color: #f4fbff; }
    main { width: min(680px, calc(100% - 40px)); padding: 48px; border: 1px solid rgba(67,215,255,.24); border-radius: 24px; background: rgba(13,28,40,.88); box-shadow: 0 24px 80px rgba(0,0,0,.32); }
    .mark { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg,#43d7ff,#39f0a0); color: #061116; font-weight: 800; margin-bottom: 20px; }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 7vw, 3.25rem); line-height: 1; }
    p { margin: 0 0 28px; color: #b9c9d3; font-size: 1.05rem; line-height: 1.65; }
    a { display: inline-block; padding: 12px 18px; border-radius: 12px; background: #39f0a0; color: #061116; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">1×</div>
    <h1>Subscription started.</h1>
    <p>Your Stripe Checkout session completed successfully. This page does not grant access by itself; production entitlement will be confirmed server-side before any paid capability is enabled.</p>
    <a href="/">Back to Once</a>
  </main>
</body>
</html>
