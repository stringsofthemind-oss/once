[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "once-agent-sdk"
version = "0.1.0"
description = "Execution safety for side-effecting AI agent tools."
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Once" }
]
keywords = [
  "ai",
  "agents",
  "idempotency",
  "reliability",
  "execution-safety"
]

[tool.setuptools.packages.find]
where = ["src"]
