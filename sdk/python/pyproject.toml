[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "once-agent-sdk"
version = "0.1.0"
description = "Execution safety for side-effecting AI agent tools."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Once" }
]
keywords = [
  "ai",
  "agents",
  "idempotency",
  "reliability",
  "execution-safety"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://onceexec.pages.dev/"
Repository = "https://github.com/stringsofthemind-oss/once"
Documentation = "https://onceexec.pages.dev/agent.md"
Issues = "https://github.com/stringsofthemind-oss/once/issues"

[tool.setuptools.packages.find]
where = ["src"]
