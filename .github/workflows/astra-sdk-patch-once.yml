name: Astra SDK Patch Once

on:
  push:
    branches:
      - fix/astra-sdk-safety-hardening

permissions:
  contents: write
  actions: read

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout SDK safety branch
        uses: actions/checkout@v4
        with:
          ref: fix/astra-sdk-safety-hardening
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download preserved Astra evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/astra
          gh run download 35779445690 \
            --repo "$GITHUB_REPOSITORY" \
            --name astra-full-audit-upgrade-evidence \
            --dir /tmp/astra
          test -s /tmp/astra/astra-full.patch

      - name: Apply only Astra SDK safety patch
        run: |
          set -euo pipefail
          git apply --check \
            --include=sdk/python/src/once_agent/core.py \
            --include=sdk/python/tests/test_safety_regressions.py \
            --include=sdk/typescript/scripts/safety-regression.mjs \
            --include=sdk/typescript/src/index.ts \
            --include=sdk/typescript/src/runtime/fetch-interceptor.ts \
            /tmp/astra/astra-full.patch
          git apply \
            --include=sdk/python/src/once_agent/core.py \
            --include=sdk/python/tests/test_safety_regressions.py \
            --include=sdk/typescript/scripts/safety-regression.mjs \
            --include=sdk/typescript/src/index.ts \
            --include=sdk/typescript/src/runtime/fetch-interceptor.ts \
            /tmp/astra/astra-full.patch

      - name: Run Python SDK regressions
        run: |
          set -euo pipefail
          python -m pip install -e ./sdk/python
          python -m unittest discover -s sdk/python/tests -p 'test*.py' -v

      - name: Install TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Typecheck TypeScript SDK
        working-directory: sdk/typescript
        run: npm run typecheck

      - name: Run TypeScript release suite
        working-directory: sdk/typescript
        run: npm run test:release

      - name: Run Astra TypeScript safety regressions
        working-directory: sdk/typescript
        run: |
          npm run build
          node ./scripts/safety-regression.mjs

      - name: Verify patch cleanliness
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat

      - name: Commit verified SDK hardening and remove helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/astra-sdk-patch-once.yml
          git add \
            sdk/python/src/once_agent/core.py \
            sdk/python/tests/test_safety_regressions.py \
            sdk/typescript/scripts/safety-regression.mjs \
            sdk/typescript/src/index.ts \
            sdk/typescript/src/runtime/fetch-interceptor.ts
          git commit -m "Harden SDK retry and runtime safety"
          git push origin HEAD:fix/astra-sdk-safety-hardening
