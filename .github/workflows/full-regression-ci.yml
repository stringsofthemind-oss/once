name: Full Regression CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  typescript-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - name: Run TypeScript release suite
        run: npm run test:release
      - name: Run TypeScript SDK safety regressions
        run: |
          npm run build
          node ./scripts/safety-regression.mjs

  python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python SDK
        run: python -m pip install -e ./sdk/python
      - name: Run Python SDK regressions
        run: python -m unittest discover -s sdk/python/tests -p 'test*.py' -v

  mcp-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - name: Audit MCP production dependencies
        run: npm audit --omit=dev
      - name: Verify MCP registered actions and connection regressions
        run: |
          npm run test:registered-action
          npm run test:connection
      - name: Typecheck MCP package
        run: npm run typecheck
      - name: Build MCP package
        run: npm run build
      - name: Run MCP smoke test
        run: npm run smoke
      - name: Verify connection semantics and public packed consumer
        run: npm run test:registered-action-package
      - name: Guard public compatibility and unpublished candidate claims
        run: node --test ../scripts/mcp-public-contract.test.mjs

      - name: Pack exact MCP release candidate (no publication)
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/once-mcp-candidate"
          mkdir -p "$dir"
          npm pack --json --pack-destination "$dir" > "$dir/pack.json"
          node --input-type=module - "$dir" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { join, basename } from 'node:path';
          const dir = process.argv[2];
          const [p] = JSON.parse(readFileSync(join(dir,'pack.json'),'utf8'));
          if (p.name !== '@once-agent/mcp' || basename(p.filename) !== p.filename) throw Error('Unexpected package');
          const bytes = readFileSync(join(dir,p.filename));
          const integrity = 'sha512-' + createHash('sha512').update(bytes).digest('base64');
          if (p.integrity !== integrity) throw Error('Pack integrity mismatch');
          const record = {name:p.name,version:p.version,integrity,sha256:createHash('sha256').update(bytes).digest('hex'),files:p.files.length};
          writeFileSync(join(dir,'candidate-artifact.json'),JSON.stringify(record,null,2)+'\n');
          console.log('CANDIDATE ARTIFACT (not yet approved):', JSON.stringify(record));
          NODE
      - name: Retain exact candidate and file inventory
        uses: actions/upload-artifact@v4
        with:
          name: mcp-release-candidate
          path: ${{ runner.temp }}/once-mcp-candidate/
          if-no-files-found: error
          retention-days: 14

  mcp-helper-node20:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run test:connection
      - run: node scripts/smoke.mjs

  openai-plugin-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Once OpenAI/Codex plugin package
        run: node scripts/validate-openai-plugin.mjs
      - name: Validate autonomous discovery runner syntax
        run: node --check scripts/run-codex-autonomous-discovery.mjs
      - name: Validate autonomous discovery cases
        run: |
          node -e "const fs=require('fs'); const p='plugins/openai/once/evals/autonomous-discovery-cases.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); if(!Array.isArray(x.cases)||x.cases.length<8) process.exit(1); console.log('AUTONOMOUS DISCOVERY CASES: PASS', x.cases.length);"
      - name: Test autonomous discovery harness without API calls
        run: node scripts/test-codex-autonomous-discovery-harness.mjs

  codex-plugin-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install current Codex CLI baseline
        run: npm install --global @openai/codex@0.155.1
      - name: Confirm Codex CLI version
        run: codex --version
      - name: Add repository marketplace
        run: codex plugin marketplace add "$GITHUB_WORKSPACE"
      - name: Confirm Once is discoverable
        run: codex plugin list
      - name: Install Once from repository marketplace
        run: codex plugin add once@once-agent
      - name: Confirm Once is installed
        run: codex plugin list
