name: OpenAI Plugin CI

on:
  pull_request:
    paths:
      - ".agents/plugins/**"
      - "plugins/openai/once/**"
      - "scripts/validate-openai-plugin.mjs"
      - ".github/workflows/openai-plugin-ci.yml"
  push:
    branches:
      - main
    paths:
      - ".agents/plugins/**"
      - "plugins/openai/once/**"
      - "scripts/validate-openai-plugin.mjs"
      - ".github/workflows/openai-plugin-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-openai-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Once Codex plugin package
        run: node scripts/validate-openai-plugin.mjs
