name: HTTP Method Preservation Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - 'sdk/typescript/**'
      - '.github/workflows/http-method-preservation-contract.yml'

permissions:
  contents: read

jobs:
  method-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - name: Build SDK
        run: npm run build
      - name: Verify HTTP method preservation boundary
        run: node ./scripts/http-method-preservation-contract.mjs
