name: Codex Autonomous Discovery

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: "Optional single autonomous-discovery case ID"
        required: false
        type: string

permissions:
  contents: read

jobs:
  autonomous-discovery:
    runs-on: ubuntu-latest
    env:
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      CODEX_HOME: /home/runner/.codex-once-discovery
      CODEX_EVAL_MODEL: gpt-5.3-codex
      CODEX_EVAL_SANDBOX: danger-full-access

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Codex API credential
        run: |
          if [ -z "$CODEX_API_KEY" ]; then
            echo "::error::CODEX_API_KEY repository secret is required for the live model-session evaluation."
            exit 1
          fi

      - name: Install current tested Codex CLI
        run: npm install --global @openai/codex@0.155.1

      - name: Install Once plugin from this checkout
        run: |
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$GITHUB_WORKSPACE"
          codex plugin add once@once-agent
          codex plugin list

      - name: Verify Once skill is visible to Codex
        run: |
          set -euo pipefail
          probe_file="$RUNNER_TEMP/codex-prompt-probe.txt"

          echo "Installed Once skill payloads:"
          find "$CODEX_HOME/plugins/cache/once-agent/once" -path '*/skills/*/SKILL.md' -type f -print || true

          if ! codex debug prompt-input probe >"$probe_file" 2>&1; then
            cat "$probe_file"
            echo "::error::Codex prompt-input probe failed before any paid model evaluation."
            exit 2
          fi

          if ! grep -Fq 'once:protect-consequential-writes' "$probe_file"; then
            echo "::error::Once plugin is installed but once:protect-consequential-writes is absent from the model-visible Codex skill catalog. Stopping before the paid evaluation."
            echo "Matching Once/plugin lines from prompt probe:"
            grep -Ei 'once|plugin|skill' "$probe_file" | head -n 120 || true
            exit 3
          fi

          echo "Once skill catalog preflight: PASS"
          grep -F 'once:protect-consequential-writes' "$probe_file" | head -n 5

      - name: Run autonomous discovery suite
        env:
          CASE_ID: ${{ inputs.case_id }}
        run: |
          args=(--out "$RUNNER_TEMP/codex-autonomous-discovery-results.json")
          if [ -n "$CASE_ID" ]; then
            args+=(--case "$CASE_ID")
          fi
          node scripts/run-codex-autonomous-discovery.mjs "${args[@]}"

      - name: Upload routing transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-autonomous-discovery-results
          path: |
            ${{ runner.temp }}/codex-autonomous-discovery-results.json
            ${{ runner.temp }}/codex-prompt-probe.txt
          if-no-files-found: warn
