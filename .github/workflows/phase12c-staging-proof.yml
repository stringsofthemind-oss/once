name: Phase 12C live Stripe staging proof

on:
  workflow_dispatch:

permissions:
  contents: read

# Default-branch registration stub.
#
# GitHub only exposes workflow_dispatch controls when the workflow exists on the
# repository default branch. The successful live staging proof is frozen under
# docs/evidence/gateway/ and references the exact tested branch head/run. Running
# this default-branch-compatible stub performs no deploy, provider call, billing
# action, or external write.

jobs:
  select-phase12c-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse proof from merged/default workflow
        shell: bash
        run: |
          echo "Safety stop: the Phase 12C live proof has been completed and frozen as evidence."
          echo "This workflow stub performs no deployment or provider call."
          exit 1
