name: Phase 12C live Stripe staging proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase12c-live-stripe-staging-proof
  cancel-in-progress: false

jobs:
  prove-hosted-lost-ack:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ONCE_PROVIDER_MASTER_KEY: ${{ secrets.ONCE_PROVIDER_MASTER_KEY }}
      ONCE_HOSTED_CREDENTIAL_ADMIN_TOKEN: ${{ secrets.ONCE_HOSTED_CREDENTIAL_ADMIN_TOKEN }}
      ONCE_STRIPE_TEST_SECRET: ${{ secrets.ONCE_STRIPE_TEST_SECRET }}
      STAGING_BASE_URL: https://once-q18-cloud-staging.pennywatch.workers.dev

    steps:
      - name: Checkout exact Phase 12C branch
        uses: actions/checkout@v4
        with:
          ref: phase12c/hosted-gateway-transport-contract
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/runtime/package-lock.json

      - name: Install runtime dependencies
        working-directory: workers/runtime
        run: npm ci

      - name: Require and validate staging-only secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN missing"; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID missing"; exit 2; }
          test -n "${ONCE_PROVIDER_MASTER_KEY:-}" || { echo "ONCE_PROVIDER_MASTER_KEY missing"; exit 2; }
          test -n "${ONCE_HOSTED_CREDENTIAL_ADMIN_TOKEN:-}" || { echo "ONCE_HOSTED_CREDENTIAL_ADMIN_TOKEN missing"; exit 2; }
          test -n "${ONCE_STRIPE_TEST_SECRET:-}" || { echo "ONCE_STRIPE_TEST_SECRET missing"; exit 2; }
          [[ "$ONCE_HOSTED_CREDENTIAL_ADMIN_TOKEN" == once_admin_stage_* ]] || { echo "admin token must be staging-scoped"; exit 2; }
          [[ "$ONCE_STRIPE_TEST_SECRET" == sk_test_* ]] || { echo "Stripe secret must be sk_test_"; exit 2; }
          node -e 'const b=Buffer.from(process.env.ONCE_PROVIDER_MASTER_KEY,"base64"); if(b.length!==32){console.error("ONCE_PROVIDER_MASTER_KEY must decode to exactly 32 bytes"); process.exit(2)}'

      - name: Run safety regressions before provider access
        working-directory: workers/runtime
        run: npm test

      - name: Install staging encryption and admin secrets in Cloudflare
        working-directory: workers/runtime
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ONCE_PROVIDER_MASTER_KEY" | npx wrangler secret put ONCE_PROVIDER_MASTER_KEY --env staging
          printf '%s' "$ONCE_HOSTED_CREDENTIAL_ADMIN_TOKEN" | npx wrangler secret put ONCE_HOSTED_CREDENTIAL_ADMIN_TOKEN --env staging

      - name: Deploy exact staging proof code
        working-directory: workers/runtime
        run: npx wrangler deploy --env staging

      - name: Wait for staging admin binding propagation
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -X POST \
              -H 'Authorization: Bearer once_admin_stage_readiness_probe_invalid' \
              -H 'Content-Type: application/json' \
              --data '{}' \
              "$STAGING_BASE_URL/__once/staging/hosted/tenants" || true)
            if [ "$status" = "401" ]; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1" || { echo "staging admin binding did not become ready"; exit 2; }

      - name: Run real Stripe sandbox lost-ack proof through hosted HTTP
        id: proof
        shell: bash
        run: |
          set -euo pipefail

          tenant="tenant_phase12c_$(date +%s)_${RANDOM}"
          stage_key="once_stage_$(openssl rand -hex 32)"
          operation_id="phase12c-staging-lostack-$(date +%s)-${RANDOM}"
          echo "::add-mask::$stage_key"

          echo "proof phase: bootstrap tenant"
          bootstrap_payload=$(jq -nc \
            --arg tenant "$tenant" \
            --arg stage_key "$stage_key" \
            '{tenant_id:$tenant,stage_key:$stage_key}')

          bootstrap=$(curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $ONCE_HOSTED_CREDENTIAL_ADMIN_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$bootstrap_payload" \
            "$STAGING_BASE_URL/__once/staging/hosted/tenants")

          test "$(jq -r '.ok' <<<"$bootstrap")" = "true"
          test "$(jq -r '.credentials' <<<"$bootstrap")" = "hash_only"

          echo "proof phase: provision encrypted Stripe test credential"
          credential_payload=$(jq -nc \
            --arg tenant "$tenant" \
            --arg secret "$ONCE_STRIPE_TEST_SECRET" \
            '{action:"rotate",tenant_id:$tenant,secret_key:$secret}')

          credential=$(curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $ONCE_HOSTED_CREDENTIAL_ADMIN_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$credential_payload" \
            "$STAGING_BASE_URL/__once/staging/hosted/credentials/stripe-refund")

          test "$(jq -r '.ok' <<<"$credential")" = "true"
          test "$(jq -r '.credentials' <<<"$credential")" = "stored_encrypted"

          echo "proof phase: create Stripe test PaymentIntent"
          payment_intent=$(curl --fail-with-body -sS \
            -X POST 'https://api.stripe.com/v1/payment_intents' \
            -H "Authorization: Bearer $ONCE_STRIPE_TEST_SECRET" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'amount=500' \
            --data-urlencode 'currency=gbp' \
            --data-urlencode 'payment_method=pm_card_visa' \
            --data-urlencode 'payment_method_types[]=card' \
            --data-urlencode 'confirm=true' \
            --data-urlencode 'metadata[once_proof]=phase12c_hosted_lost_ack')

          pi_id=$(jq -r '.id // empty' <<<"$payment_intent")
          pi_status=$(jq -r '.status // empty' <<<"$payment_intent")
          test -n "$pi_id"
          test "$pi_status" = "succeeded"

          execute_payload=$(jq -nc \
            --arg operation_id "$operation_id" \
            --arg pi "$pi_id" \
            '{operation_id:$operation_id,target:{provider:"stripe",action:"refund.create"},payload:{payment_intent:$pi,amount:100}}')

          echo "proof phase: inject lost acknowledgement through hosted execute"
          first=$(curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $stage_key" \
            -H 'Content-Type: application/json' \
            --data "$execute_payload" \
            "$STAGING_BASE_URL/__once/staging/hosted/v1/execute")

          first_decision=$(jq -r '.decision // empty' <<<"$first")
          effect_hash=$(jq -r '.effect_hash // empty' <<<"$first")
          test "$first_decision" = "BLOCK_UNKNOWN"
          test -n "$effect_hash"

          echo "proof phase: reconcile retry"
          decision=""
          retry='{}'
          for attempt in $(seq 1 12); do
            retry=$(curl --fail-with-body -sS \
              -X POST \
              -H "Authorization: Bearer $stage_key" \
              -H 'Content-Type: application/json' \
              --data "$execute_payload" \
              "$STAGING_BASE_URL/__once/staging/hosted/v1/execute")
            decision=$(jq -r '.decision // empty' <<<"$retry")
            if [ "$decision" = "REPLAY_CONFIRMED" ]; then
              break
            fi
            test "$decision" = "BLOCK_UNKNOWN"
            sleep 2
          done
          test "$decision" = "REPLAY_CONFIRMED"

          refund_id=$(jq -r '.result.refundId // .result.providerReference // empty' <<<"$retry")
          test -n "$refund_id"

          echo "proof phase: verify exactly one Stripe refund"
          refunds=$(curl --fail-with-body -sS \
            -G 'https://api.stripe.com/v1/refunds' \
            -H "Authorization: Bearer $ONCE_STRIPE_TEST_SECRET" \
            --data-urlencode "payment_intent=$pi_id" \
            --data-urlencode 'limit=100')

          matches=$(jq \
            --arg op "$operation_id" \
            --arg hash "$effect_hash" \
            '[.data[] | select(.metadata.once_operation_id == $op and .metadata.once_effect_hash == $hash and .amount == 100)] | length' \
            <<<"$refunds")
          test "$matches" = "1"

          echo "proof phase: disable tenant Stripe credential"
          disable_payload=$(jq -nc --arg tenant "$tenant" '{action:"disable",tenant_id:$tenant}')
          disabled=$(curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $ONCE_HOSTED_CREDENTIAL_ADMIN_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$disable_payload" \
            "$STAGING_BASE_URL/__once/staging/hosted/credentials/stripe-refund")
          test "$(jq -r '.disabled' <<<"$disabled")" = "true"

          echo "proof phase: confirm local replay without provider credential"
          final_replay=$(curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $stage_key" \
            -H 'Content-Type: application/json' \
            --data "$execute_payload" \
            "$STAGING_BASE_URL/__once/staging/hosted/v1/execute")
          test "$(jq -r '.decision' <<<"$final_replay")" = "REPLAY_CONFIRMED"

          jq -n \
            --arg proof 'ONCE_PHASE_12C_HOSTED_STRIPE_STAGING_LOST_ACK' \
            --arg tenant "$tenant" \
            --arg operation_id "$operation_id" \
            --arg payment_intent "$pi_id" \
            --arg refund_id "$refund_id" \
            --arg effect_hash "$effect_hash" \
            --arg first_decision "$first_decision" \
            --arg retry_decision "$decision" \
            --arg final_decision "$(jq -r '.decision' <<<"$final_replay")" \
            --argjson matching_refunds "$matches" \
            '{proof:$proof,passed:true,tenant:$tenant,operation_id:$operation_id,payment_intent:$payment_intent,refund_id:$refund_id,effect_hash:$effect_hash,first_decision:$first_decision,retry_decision:$retry_decision,final_decision:$final_decision,matching_provider_refunds:$matching_refunds,amount:100,currency:"gbp",livemode:false,credential_disabled_after_proof:true}' \
            | tee phase12c-staging-proof.json

      - name: Upload safe proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase12c-hosted-stripe-staging-proof
          path: phase12c-staging-proof.json
          if-no-files-found: error
          retention-days: 30
