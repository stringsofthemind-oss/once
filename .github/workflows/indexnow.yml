name: IndexNow notify

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployed IndexNow key
        shell: bash
        run: |
          set -euo pipefail
          KEY="e7446e8ebe87241334541be52e68eacd"
          KEY_URL="https://onceexec.com/${KEY}.txt"

          for i in $(seq 1 30); do
            BODY="$(curl -fsS "$KEY_URL" 2>/dev/null || true)"
            if [ "$BODY" = "$KEY" ]; then
              echo "IndexNow key is live."
              exit 0
            fi
            echo "Waiting for Cloudflare Pages deployment ($i/30)..."
            sleep 10
          done

          echo "IndexNow key did not become available in time."
          exit 1

      - name: Submit Once discovery URLs to IndexNow
        shell: bash
        run: |
          set -euo pipefail
          KEY="e7446e8ebe87241334541be52e68eacd"
          KEY_URL="https://onceexec.com/${KEY}.txt"

          cat > indexnow-payload.json <<JSON
          {
            "host": "onceexec.com",
            "key": "$KEY",
            "keyLocation": "$KEY_URL",
            "urlList": [
              "https://onceexec.com/",
              "https://onceexec.com/mcp-idempotency/",
              "https://onceexec.com/ai-agent-retry-safety/",
              "https://onceexec.com/ambiguous-timeout/",
              "https://onceexec.com/duplicate-refund-timeout/",
              "https://onceexec.com/duplicate-booking-retry/"
            ]
          }
          JSON

          HTTP_CODE="$(curl -sS -o indexnow-response.txt -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @indexnow-payload.json)"

          echo "IndexNow HTTP status: $HTTP_CODE"
          cat indexnow-response.txt || true

          case "$HTTP_CODE" in
            200|202)
              echo "IndexNow submission accepted."
              ;;
            *)
              echo "IndexNow submission failed."
              exit 1
              ;;
          esac
