name: HTTP Response Capability Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  capability-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20"
          - "24"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install SDK dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Build SDK
        working-directory: sdk/typescript
        run: npm run build

      - name: Prove response replay capability contract
        working-directory: sdk/typescript
        run: node ./scripts/http-response-capability-regression.mjs

      - name: Prove immediate JSON response consumption contract
        working-directory: sdk/typescript
        run: node ./scripts/http-json-consumption-regression.mjs

      - name: Prove HTTP response replay v2 native contract
        working-directory: sdk/typescript
        run: node ./scripts/http-response-replay-v2-regression.mjs

      - name: Prove packed native Response consumer contract
        working-directory: sdk/typescript
        run: node ./scripts/http-response-packed-consumer-regression.mjs

      - name: Prove assigned native Response transform and patch contract
        working-directory: sdk/typescript
        run: node ./scripts/http-response-assignment-regression.mjs

      - name: Prove returned native Response transform and patch contract
        working-directory: sdk/typescript
        run: node ./scripts/http-response-return-regression.mjs

      - name: Prove public helper binding and patch contract
        working-directory: sdk/typescript
        run: node ./scripts/http-json-binding-regression.mjs

      - name: Prove packed consumer binding path
        working-directory: sdk/typescript
        run: node ./scripts/http-json-packed-binding-regression.mjs

      - name: Prove assigned and returned native Response protect/apply integration end to end
        working-directory: sdk/typescript
        run: node ./scripts/http-native-response-integration-regression.mjs

      - name: Pin HTTP autoprotection benchmark
        working-directory: sdk/typescript
        run: npm run benchmark:http-autoprotection
