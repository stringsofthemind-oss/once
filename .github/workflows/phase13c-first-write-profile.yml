name: Phase 13C First Write Profile

on:
  push:
    branches:
      - phase13c/mcp-first-write-latency
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Profile local first-write setup
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdtempSync, rmSync } from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { DatabaseSync } from 'node:sqlite';
          import { protectLocal } from './dist/local.js';

          const dir = mkdtempSync(path.join(os.tmpdir(), 'once-first-write-profile-'));
          const statePath = path.join(dir, 'state.sqlite');
          const N = 80;
          const schema = "CREATE TABLE IF NOT EXISTS local_operations (id TEXT PRIMARY KEY, fingerprint TEXT NOT NULL, state TEXT NOT NULL CHECK(state IN ('CLAIMED','UNKNOWN','CONFIRMED')), result_json TEXT, owner TEXT, lease_until INTEGER);";
          const percentile = (values, p) => {
            const sorted = [...values].sort((a, b) => a - b);
            return Number(sorted[Math.min(sorted.length - 1, Math.floor((sorted.length - 1) * p))].toFixed(3));
          };
          const sample = async fn => {
            const values = [];
            for (let i = 0; i < N; i++) {
              const started = performance.now();
              await fn(i);
              values.push(performance.now() - started);
            }
            return { p50: percentile(values, 0.50), p95: percentile(values, 0.95) };
          };
          const writeRaw = (db, id) => {
            db.exec('BEGIN IMMEDIATE');
            db.prepare("INSERT INTO local_operations(id,fingerprint,state,result_json,owner,lease_until) VALUES(?,?,'CLAIMED',NULL,?,?)")
              .run(id, 'fp', 'owner', Date.now() + 30_000);
            db.exec('COMMIT');
            db.prepare("UPDATE local_operations SET state='CONFIRMED',result_json=?,owner=NULL,lease_until=NULL WHERE id=?")
              .run('{"hasValue":false}', id);
          };

          try {
            const direct = await sample(async () => {});

            const reused = protectLocal(
              async input => ({ ok: true, id: input.id }),
              {
                statePath,
                id: input => input.id,
                payload: input => ({ value: input.value }),
              },
            );
            const reusedWrapper = await sample(i => reused({ id: `reuse-${i}`, value: i }));

            const rebuiltWrapper = await sample(i => {
              const call = protectLocal(
                async input => ({ ok: true, id: input.id }),
                {
                  statePath,
                  id: input => input.id,
                  payload: input => ({ value: input.value }),
                },
              );
              return call({ id: `rebuild-${i}`, value: i });
            });

            const freshPath = path.join(dir, 'fresh.sqlite');
            const freshSetup = await sample(i => {
              const db = new DatabaseSync(freshPath, { timeout: 30_000 });
              try {
                db.exec(`PRAGMA journal_mode=WAL; PRAGMA synchronous=FULL; ${schema}`);
                writeRaw(db, `fresh-${i}`);
              } finally {
                db.close();
              }
            });

            const reopenPath = path.join(dir, 'reopen.sqlite');
            {
              const db = new DatabaseSync(reopenPath, { timeout: 30_000 });
              db.exec(`PRAGMA journal_mode=WAL; PRAGMA synchronous=FULL; ${schema}`);
              db.close();
            }
            const reopenInitialized = await sample(i => {
              const db = new DatabaseSync(reopenPath, { timeout: 30_000 });
              try {
                db.exec('PRAGMA synchronous=FULL');
                writeRaw(db, `reopen-${i}`);
              } finally {
                db.close();
              }
            });

            const persistentPath = path.join(dir, 'persistent.sqlite');
            const persistent = new DatabaseSync(persistentPath, { timeout: 30_000 });
            persistent.exec(`PRAGMA journal_mode=WAL; PRAGMA synchronous=FULL; ${schema}`);
            let persistentConnection;
            try {
              persistentConnection = await sample(i => writeRaw(persistent, `persistent-${i}`));
            } finally {
              persistent.close();
            }

            console.log('ONCE FIRST WRITE PROFILE', JSON.stringify({
              direct,
              reusedWrapper,
              rebuiltWrapper,
              freshSetup,
              reopenInitialized,
              persistentConnection,
            }));
          } finally {
            rmSync(dir, { recursive: true, force: true });
          }
          NODE
