name: Slice 6 Integration Authoring

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'http-response-native-integrated-slice6'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: http-response-native-integrated-slice6
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply guarded integration edits
        run: node sdk/typescript/scripts/slice6-author.mjs

      - name: Remove one-shot authoring files
        run: |
          rm sdk/typescript/scripts/slice6-author.mjs
          rm .github/workflows/slice6-author.yml

      - name: Commit authored integration
        run: |
          git config user.name "Once"
          git config user.email "stringsofthemind@gmail.com"
          git add sdk/typescript/src/protect.ts sdk/typescript/src/apply.ts sdk/typescript/scripts/slice6-author.mjs .github/workflows/slice6-author.yml
          git diff --cached --exit-code && { echo "No authored changes"; exit 1; } || true
          git commit -m "Integrate native Response protect and apply planning"
          git push origin HEAD:http-response-native-integrated-slice6
