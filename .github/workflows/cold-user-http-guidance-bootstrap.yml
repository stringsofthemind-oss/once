name: Cold-user HTTP guidance bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'adoption/cold-user-http-guidance-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: adoption/cold-user-http-guidance-v1
          fetch-depth: 0
      - name: Apply bounded guidance fix and targeted regressions
        env:
          GITHUB_REF_NAME: adoption/cold-user-http-guidance-v1
        run: node scripts/cold-user-http-guidance-bootstrap-v2.mjs
