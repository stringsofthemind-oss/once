name: Hermes Real External Effect Proof

on:
  push:
    branches:
      - proof/hermes-real-external-effect
    paths:
      - '.github/workflows/hermes-real-external-effect-proof.yml'
      - 'examples/hermes-agent-hostile-retry/github_real_effect_proof.py'

permissions:
  contents: read
  issues: write

jobs:
  real-github-effect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Once proof branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Once Python SDK
        run: python -m pip install -e ./sdk/python

      - name: Checkout pinned Hermes Agent
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ea81748579ee1732d214ccb75f91d22208ed623d
          path: .compat/hermes-agent
          persist-credentials: false
          fetch-depth: 1

      - name: Run real GitHub lost-ack effect proof through actual Hermes middleware
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python examples/hermes-agent-hostile-retry/github_real_effect_proof.py .compat/hermes-agent
