name: ADK completed sibling replay regression
on:
  pull_request:
    paths:
      - 'examples/adk-parallel-replay/**'
      - 'sdk/typescript/**'
      - '.github/workflows/adk-parallel-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        label: [release-2.11.0, pr-base, pr-fixed]
        include:
          - label: release-2.11.0
            ref: ''
            options: ''
          - label: pr-base
            ref: c220fca16a7e7f7620bde799c50b240f2451ef79
            options: '--adk-src upstream-adk/src'
          - label: pr-fixed
            ref: 3e309d5d3eb753343590e28baf5b8efc547645c8
            options: '--adk-src upstream-adk/src --expect-kept'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: matrix.ref != ''
        with:
          repository: google/adk-python
          ref: ${{ matrix.ref }}
          path: upstream-adk
          sparse-checkout: src
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: npm ci --prefix sdk/typescript
      - run: npm run build --prefix sdk/typescript
      - run: python -m pip install -r examples/adk-parallel-replay/requirements.lock.txt
      - run: python -m pip check
      - run: python examples/adk-parallel-replay/verify.py ${{ matrix.options }} --label ${{ matrix.label }} --output evidence/${{ matrix.label }}.json
      - run: python examples/adk-parallel-replay/check_evidence.py evidence/${{ matrix.label }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: adk-parallel-${{ matrix.os }}-${{ matrix.label }}
          path: evidence/*.json
