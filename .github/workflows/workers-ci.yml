name: Worker CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - "workers/runtime/**"
      - "workers/playground/**"
      - "workers/demo-provider/**"
      - "workers/evaluation/**"
      - "scripts/deploy-worker.cjs"
      - ".github/workflows/workers-ci.yml"

permissions:
  contents: read

jobs:
  guard-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deploy guard syntax
        run: node --check scripts/deploy-worker.cjs

  worker-dry-run:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        worker:
          - runtime
          - playground
          - demo-provider

    defaults:
      run:
        working-directory: workers/${{ matrix.worker }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/${{ matrix.worker }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run guarded Worker dry-run
        run: npm run deploy:dry-run

      - name: Run runtime safety regressions
        if: matrix.worker == 'runtime'
        run: npm test

  evaluation-dry-run:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: workers/evaluation

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate evaluation Worker syntax
        run: node --check src/index.js

      - name: Validate live E2E bridge syntax
        run: node --check e2e/bridge.js

      - name: Validate live E2E PowerShell syntax
        shell: pwsh
        run: |
          foreach ($path in @('e2e/run-live.ps1', 'e2e/run-preview-live.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path: $($_.Message)" }
              exit 1
            }
          }

      - name: Run evaluation Worker regressions
        run: npm test

      - name: Run evaluation Worker dry-run
        run: npx --yes wrangler@4.135.0 deploy --dry-run --config wrangler.jsonc

  mcp-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck MCP package
        run: npm run typecheck

      - name: Build MCP package
        run: npm run build

      - name: Run MCP smoke test
        run: npm run smoke
