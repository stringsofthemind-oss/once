name: Astra Runtime Patch Once

on:
  push:
    branches:
      - fix/astra-runtime-safety-hardening

permissions:
  contents: write
  actions: read

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout safety branch
        uses: actions/checkout@v4
        with:
          ref: fix/astra-runtime-safety-hardening
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/runtime/package-lock.json

      - name: Download preserved Astra evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/astra
          gh run download 35779445690 \
            --repo "$GITHUB_REPOSITORY" \
            --name astra-full-audit-upgrade-evidence \
            --dir /tmp/astra
          test -s /tmp/astra/astra-full.patch

      - name: Apply only Astra runtime source patch
        run: |
          set -euo pipefail
          git apply --check \
            --include=workers/runtime/src/index.js \
            /tmp/astra/astra-full.patch
          git apply \
            --include=workers/runtime/src/index.js \
            /tmp/astra/astra-full.patch

      - name: Validate runtime source syntax
        run: node --check workers/runtime/src/index.js

      - name: Install runtime dependencies
        working-directory: workers/runtime
        run: npm ci

      - name: Run focused runtime safety regressions
        working-directory: workers/runtime
        run: npm test

      - name: Run guarded Worker dry-run
        working-directory: workers/runtime
        run: npm run deploy:dry-run

      - name: Verify patch cleanliness
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat

      - name: Commit verified runtime hardening and remove helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/astra-runtime-patch-once.yml
          git add workers/runtime/src/index.js
          git commit -m "Harden runtime execution safety"
          git push origin HEAD:fix/astra-runtime-safety-hardening
