# Phase 13 extends SDK CI so MCP boundary changes exercise the combined end-to-end path.
name: SDK CI

on:
  pull_request:
    paths:
      - "sdk/typescript/**"
      - "sdk/python/**"
      - "mcp/**"
      - "conformance/**"
      - ".github/workflows/sdk-ci.yml"
  push:
    branches:
      - main
      - benchmark/phase1-instrumentation
    paths:
      - "sdk/typescript/**"
      - "sdk/python/**"
      - "mcp/**"
      - "conformance/**"
      - ".github/workflows/sdk-ci.yml"

permissions:
  contents: read

jobs:
  test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24.15
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Use Python 3.12 for cross-language conformance
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python SDK dependencies
        run: python -m pip install -e ../python

      - name: Run release suite
        run: npm run test:release

      - name: Run SDK safety regressions
        run: |
          npm run build
          node ./scripts/safety-regression.mjs

  python-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python SDK
        run: python -m pip install -e ./sdk/python

      - name: Run Python SDK regressions
        run: python -m unittest discover -s sdk/python/tests -p 'test*.py' -v

  local-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24.15
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run source-tree local regressions
        run: npm run test:local

      - name: Run materialized reviewed companion execution proof
        run: node ./scripts/materialized-companion-proof-regression.mjs

      - name: Run persistent local state and recovery regressions
        run: node --test ./test/local-session.test.mjs ./test/operation-recovery.test.mjs

      - name: Run MCP boundary mutation regressions
        run: node --test ./test/connect/mcp-execution-boundary-mutation.test.mjs

      - name: Run packed Connect local protection regression
        run: npm run test:connect-package-protected

      - name: Run packed Gateway local protection regression
        run: npm run test:gateway-package-protected

      - name: Install MCP proxy test dependencies
        working-directory: mcp
        run: npm ci

      - name: Pack source SDK for MCP integration
        run: |
          mkdir -p ../../.ci-sdk-pack
          npm pack --silent --pack-destination ../../.ci-sdk-pack

      - name: Install packed source SDK into MCP integration
        working-directory: mcp
        run: npm install --no-save --package-lock=false ../.ci-sdk-pack/*.tgz

      - name: Build MCP proxy adapter
        working-directory: mcp
        run: npm run build

      - name: Run Phase 13 MCP end-to-end regression
        working-directory: mcp
        run: node scripts/phase13-boundary-e2e.mjs

      - name: Run Phase 13B disposable stdio process regression
        working-directory: mcp
        run: node scripts/phase13b-stdio-e2e.mjs

      - name: Run Phase 13C replay catalog fast-path regression
        working-directory: mcp
        run: node scripts/phase13c-replay-catalog-e2e.mjs

      - name: Run Phase 13C persistent state regression
        working-directory: mcp
        run: node scripts/phase13c-persistent-state-e2e.mjs


  independent-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: once_integration
          POSTGRES_PASSWORD: once_integration
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d once_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: npm ci
      - run: npm run build
      - run: npm install --prefix "$RUNNER_TEMP/once-pg" --ignore-scripts --no-save pg@8.16.3
      - name: Test independent admission with real PostgreSQL and separate workers
        env:
          ONCE_TEST_POSTGRES_URL: postgresql://postgres:once_integration@localhost:${{ job.services.postgres.ports[5432] }}/once_integration
        run: |
          export ONCE_TEST_PG_MODULE="file://$RUNNER_TEMP/once-pg/node_modules/pg/lib/index.js"
          node --test ./test/postgres-admission.integration.mjs
