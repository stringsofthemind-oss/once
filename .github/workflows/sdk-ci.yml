name: SDK CI

on:
  pull_request:
    paths:
      - "sdk/typescript/**"
      - ".github/workflows/sdk-ci.yml"
  push:
    branches:
      - main
      - benchmark/phase1-instrumentation
    paths:
      - "sdk/typescript/**"
      - ".github/workflows/sdk-ci.yml"

permissions:
  contents: read

jobs:
  test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Frozen vector hash diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('../../conformance/once-id-v1-vectors.json')
          data = path.read_bytes()
          print('actual-lf:', hashlib.sha256(data).hexdigest())
          print('as-crlf:', hashlib.sha256(data.replace(b'\n', b'\r\n')).hexdigest())
          print('expected:', Path('../../conformance/once-id-v1-vectors.json.sha256').read_text().split()[0])
          PY

      - name: Run release suite
        run: npm run test:release
