# PR #46 full-regression trigger only; workflow behavior unchanged.
name: SDK CI

on:
  pull_request:
    paths:
      - "sdk/typescript/**"
      - "sdk/python/**"
      - "conformance/**"
      - ".github/workflows/sdk-ci.yml"
  push:
    branches:
      - main
      - benchmark/phase1-instrumentation
    paths:
      - "sdk/typescript/**"
      - "sdk/python/**"
      - "conformance/**"
      - ".github/workflows/sdk-ci.yml"

permissions:
  contents: read

jobs:
  test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run release suite
        run: npm run test:release

      - name: Run SDK safety regressions
        run: |
          npm run build
          node ./scripts/safety-regression.mjs

  python-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python SDK
        run: python -m pip install -e ./sdk/python

      - name: Run Python SDK regressions
        run: python -m unittest discover -s sdk/python/tests -p 'test*.py' -v

  local-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run test:local
