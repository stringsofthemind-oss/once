# Phase 13 extends SDK CI so MCP boundary changes exercise the combined end-to-end path.
name: SDK CI

on:
  pull_request:
    paths:
      - "sdk/typescript/**"
      - "sdk/python/**"
      - "mcp/**"
      - "conformance/**"
      - "README.md"
      - "docs/START_HERE.md"
      - "docs/GUARANTEES.md"
      - "docs/IDENTITY_AND_EFFECT.md"
      - "docs/UNKNOWN_PLAYBOOK.md"
      - "docs/PRODUCTION_OPERATION.md"
      - "docs/published-versions.json"
      - "scripts/check-current-onboarding.mjs"
      - "scripts/test-current-onboarding.mjs"
      - "scripts/test-openai-plugin-line-endings.mjs"
      - ".github/workflows/sdk-ci.yml"
  push:
    branches:
      - main
      - benchmark/phase1-instrumentation
    paths:
      - "sdk/typescript/**"
      - "sdk/python/**"
      - "mcp/**"
      - "conformance/**"
      - "README.md"
      - "docs/START_HERE.md"
      - "docs/GUARANTEES.md"
      - "docs/IDENTITY_AND_EFFECT.md"
      - "docs/UNKNOWN_PLAYBOOK.md"
      - "docs/PRODUCTION_OPERATION.md"
      - "docs/published-versions.json"
      - "scripts/check-current-onboarding.mjs"
      - "scripts/test-current-onboarding.mjs"
      - "scripts/test-openai-plugin-line-endings.mjs"
      - ".github/workflows/sdk-ci.yml"

permissions:
  contents: read

jobs:
  legacy-runtime-boundary:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20']
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Hosted compatibility and unsupported local admission
        run: node --test ./test/connect/*.test.mjs ./test/unsupported-runtime.test.mjs

  onboarding-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24.15.0']
        include:
          - os: ubuntu-latest
            node: '24.x'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Local and connected execution contracts
        run: node --test ./test/local.test.mjs ./test/local-session.test.mjs ./test/connect/*.test.mjs ./test/first-action.test.mjs
      - name: Isolated packed first-action proof
        run: npm run test:first-action-package
      - name: Retained authority and explicit loss boundary
        run: npm run test:authority-continuity
      - name: Exact authority state and independent provider forensic evidence
        run: npm run test:authority-forensics
      - name: Current onboarding release references
        run: node ../../scripts/check-site-surface.mjs
      - name: Onboarding drift regressions
        run: node ../../scripts/test-current-onboarding.mjs
      - name: Plugin frontmatter portability
        run: node ../../scripts/test-openai-plugin-line-endings.mjs

  test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run release suite
        run: npm run test:release

      - name: Run SDK safety regressions
        run: |
          npm run build
          node ./scripts/safety-regression.mjs

  python-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python SDK
        run: python -m pip install -e ./sdk/python

      - name: Run Python SDK regressions
        run: python -m unittest discover -s sdk/python/tests -p 'test*.py' -v

  local-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24.15
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run source-tree local regressions
        run: npm run test:local

      - name: Run materialized reviewed companion execution proof
        run: node ./scripts/materialized-companion-proof-regression.mjs

      - name: Run packed first-action proof
        run: npm run test:first-action-package

      - name: Run MCP boundary mutation regressions
        run: node --test ./test/connect/mcp-execution-boundary-mutation.test.mjs

      - name: Run packed Connect local protection regression
        run: npm run test:connect-package-protected

      - name: Run packed Gateway local protection regression
        run: npm run test:gateway-package-protected

      - name: Install MCP proxy test dependencies
        working-directory: mcp
        run: npm ci

      - name: Pack source SDK for MCP integration
        run: |
          mkdir -p ../../.ci-sdk-pack
          npm pack --silent --pack-destination ../../.ci-sdk-pack

      - name: Install packed source SDK into MCP integration
        working-directory: mcp
        run: npm install --no-save --package-lock=false ../.ci-sdk-pack/*.tgz

      - name: Build MCP proxy adapter
        working-directory: mcp
        run: npm run build

      - name: Run Phase 13 MCP end-to-end regression
        working-directory: mcp
        run: node scripts/phase13-boundary-e2e.mjs

      - name: Run Phase 13B disposable stdio process regression
        working-directory: mcp
        run: node scripts/phase13b-stdio-e2e.mjs

      - name: Run Phase 13C replay catalog fast-path regression
        working-directory: mcp
        run: node scripts/phase13c-replay-catalog-e2e.mjs

      - name: Run Phase 13C persistent state regression
        working-directory: mcp
        run: node scripts/phase13c-persistent-state-e2e.mjs
