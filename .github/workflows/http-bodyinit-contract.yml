name: HTTP BodyInit Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  bodyinit-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20"
          - "24"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install SDK dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Build SDK
        working-directory: sdk/typescript
        run: npm run build

      - name: Prove BodyInit normalization and capability contract
        working-directory: sdk/typescript
        run: node ./scripts/http-bodyinit-contract-regression.mjs

      - name: Prove BodyInit execution action contract
        working-directory: sdk/typescript
        run: node ./scripts/http-body-write-contract-regression.mjs

      - name: Prove worker BodyInit request reconstruction contract
        run: node --test workers/runtime/test/http-bodyinit-execution.test.mjs

      - name: Pin HTTP autoprotection benchmark
        working-directory: sdk/typescript
        run: npm run benchmark:http-autoprotection
