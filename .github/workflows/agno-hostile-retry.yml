name: Agno Hostile Retry Evidence

on:
  pull_request:
    paths:
      - "examples/agno-hostile-retry/**"
      - ".github/workflows/agno-hostile-retry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: examples/agno-hostile-retry

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24.15
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install released Once SDK
        run: npm install --no-save --no-package-lock @once-agent/sdk@0.1.12

      - name: Verify installed Once version
        run: npm ls @once-agent/sdk --depth=0

      - name: Install exact Agno reproduction dependencies
        run: python -m pip install "agno==3.0.10" "openai==3.16.2"

      - name: Run hostile-retry proof
        run: python verify.py

      - name: Show evidence
        if: always()
        run: |
          if [ -f evidence.json ]; then
            cat evidence.json
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agno-hostile-retry-evidence
          path: examples/agno-hostile-retry/evidence.json
          if-no-files-found: warn
