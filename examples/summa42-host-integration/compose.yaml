name: once-silent-chicken-fixture
services:
  execution:
    image: postgres:18.6
    environment:
      POSTGRES_USER: once_fixture
      POSTGRES_PASSWORD: fixture-only-ci
    ports: ['127.0.0.1:54369:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U once_fixture']
      interval: 3s
      timeout: 3s
      retries: 20
  witness:
    image: postgres:18.6
    environment:
      POSTGRES_USER: once_fixture
      POSTGRES_PASSWORD: fixture-only-ci
    ports: ['127.0.0.1:54370:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U once_fixture']
      interval: 3s
      timeout: 3s
      retries: 20
